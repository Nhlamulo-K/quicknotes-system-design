<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple online notes manager</p>
    </header>

    <main>
        <section>
            <h2>Your Notes</h2>

            <button id="load-btn" type="button">Load notes</button>

            <p id="status" role="status" aria-live="polite"></p>

            <ul id="notes-list"></ul>
        </section>

        <section>
            <h2>Create a Note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Title</label>
                    <input
                        type="text"
                        id="title-input"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="body-input">Note body</label>
                    <textarea id="body-input" rows="5"></textarea>
                </div>

                <button id="submit-btn" type="submit">
                    Create note
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p>QuickNotes API Client Practice Project</p>
    </footer>
</body>
</html>
